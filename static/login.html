<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f5f7">
  <title>登录 · 链种工坊 LinkSeed</title>
  <script src="/theme-init.js"></script>
  <link rel="icon" href="/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
</head>
<body class="login-body">
  <div class="login-wrap">
    <div class="login-card">
      <div class="login-brand">
        <img src="/logo.svg" alt="" width="52" height="52">
        <div><strong>链种工坊</strong><small>LinkSeed · 链接与种子</small></div>
      </div>
      <form id="loginForm">
        <label class="login-field">
          <span>访问密码</span>
          <input type="password" id="password" autocomplete="current-password" placeholder="请输入密码" required autofocus>
        </label>
        <label class="login-remember">
          <input type="checkbox" id="remember">
          <span>30 天内免登录</span>
        </label>
        <p class="login-error" id="loginError" hidden></p>
        <button class="btn btn-primary btn-block" id="loginBtn" type="submit">登录</button>
      </form>
      <p class="login-hint">密码由部署时的 <code>ED2K_PASSWORD</code> 环境变量设置。</p>
    </div>
  </div>
  <script src="/login.js"></script>
</body>
</html>
